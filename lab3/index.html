<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Лабораторна робота №3 — прототип новинного сайту на Vue.js 3 з Vue Router 4"
    />
    <title>Вісник — новини про веб</title>
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('vuejs-labs-2026:lab3:theme')
          var preferred = window.matchMedia('(prefers-color-scheme: dark)').matches
          var theme =
            stored === 'dark' || stored === 'light' ? stored : preferred ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
